runtime:
  # owner resolved from GEODEPLOY_DEPLOY_USER / DEPLOY_USER /
  # /etc/geodineum/deploy.env.
  # geodineum-code: shared framework/library source readers (www-data, geodine).
  group: geodineum-code

triggers:
  - match: "**/*.php"
    actions: [opcache-clear]

dirty-tree:
  strategy: stash

cli:
  commands:
    - name: client contract
      handler: scripts/cli/client-contract.sh
      description: Print the gNode-Client integration contract (storage, streams, comms/health producers, FCALL allowlist)
      category: Client
